ktor:
  application:
    modules:
      - com.tenmilelabs.application.service.ApplicationKt.module
  deployment:
    port: 8080
 #   port: 8082
 # - Change port while developing to run a dev instance along
 # with a docker-compose started postgres DB

jwt:
  secret: "your-secret-key-change-this-in-production"
  issuer: "http://0.0.0.0:8080"
  audience: "chefai-backend"
  realm: "ChefAI"

cleanup:
  softDelete:
    enabled: true
    retentionDays: 90
    intervalHours: 24
    batchSize: 500
    dryRun: false

imageBlob:
  allowScrapedImageUpload: true
  serveScrapedBlobsToNonOwners: true
  maxUploadBytes: 5242880 # 5 MiB
  perUserQuotaBytes: 524288000 # 500 MiB
  unreferencedRetentionDays: 30
  uploadRateLimitPerMinute: 60
  reclamation:
    enabled: true
    intervalHours: 24
    batchSize: 100

# WARNING - For prod use env variables:
# Look at https://ktor.io/docs/rsa-keys-generation.html#defining-the-private-key for key gen
#  secret: "${JWT_SECRET}"  # Use environment variable
#  export JWT_SECRET="your-production-secret-key"
#  export JWT_ISSUER="https://your-domain.com"
