ktor:
  application:
    modules:
      - com.tenmilelabs.application.service.ApplicationKt.module
  deployment:
    port: 8080
 #   port: 8082
 # - Change port while developing to run a dev instance along
 # with a docker-compose started postgres DB

jwt:
  # Sourced from the environment, with an empty default so a missing variable falls through to
  # Application.kt's resolveJwtSecret(), which fails startup outside development mode rather than
  # signing with a guessable key. Generate one with: openssl rand -base64 48
  secret: "$JWT_SECRET:"
  issuer: "http://0.0.0.0:8080"
  audience: "chefai-backend"
  realm: "ChefAI"

cleanup:
  softDelete:
    enabled: true
    retentionDays: 90
    intervalHours: 24
    batchSize: 500
    dryRun: false

imageBlob:
  allowScrapedImageUpload: true
  serveScrapedBlobsToNonOwners: true
  maxUploadBytes: 5242880 # 5 MiB
  perUserQuotaBytes: 524288000 # 500 MiB
  unreferencedRetentionDays: 30
  uploadRateLimitPerMinute: 60
  reclamation:
    enabled: true
    intervalHours: 24
    batchSize: 100

# JWT_SECRET is mandatory outside development mode - the app refuses to boot without it.
#   export JWT_SECRET="$(openssl rand -base64 48)"
# Rotating it invalidates every access token already issued (refresh tokens are opaque DB rows
# and survive). See docs/auth-architecture.md.
